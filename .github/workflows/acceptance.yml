name: Fixture acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python verify.py junit.xml
