name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked
      - name: Verify toolchain
        run: uv run --locked python -c "import platform; assert platform.python_version() == '3.12.13'; print(platform.python_version())"
      - name: Run Katydid against its own profile
        run: uv run --locked katydid run katydid.yaml
      - name: Run example repository
        run: uv run --locked katydid run examples/python-service/quality.yaml
      - name: Verify SQLite preparation, readiness, tests, and cleanup
        run: uv run --locked katydid run examples/sqlite-service/quality.yaml
      - name: Build package
        run: uv build --no-sources
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ matrix.os }}
          path: |
            .katydid/runs/
            examples/python-service/.katydid/runs/
            examples/sqlite-service/.katydid/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  isolation:
    name: Container isolation (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KATYDID_DOCKER_IMAGE: python@sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Install locked host environment
        run: uv sync --locked
      - name: Install the approved immutable test image
        run: docker pull "$KATYDID_DOCKER_IMAGE"
      - name: Exercise real containment, cancellation, and orphan recovery
        run: uv run --locked pytest tests/test_docker_integration.py -v --junitxml=.katydid/docker/junit.xml
      - name: Run the offline isolated example
        run: uv run --locked katydid run examples/isolated-python/quality.yaml
      - name: Preserve isolation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isolation-evidence-ubuntu-24.04
          path: |
            .katydid/docker/
            examples/isolated-python/.katydid/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: Browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: examples/browser-service/package-lock.json
      - name: Install locked Python environment
        run: uv sync --locked
      - name: Install locked browser dependencies
        working-directory: examples/browser-service
        run: npm ci
      - name: Install Chromium and host dependencies
        working-directory: examples/browser-service
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Test the browser service through Katydid
        run: uv run --locked katydid run examples/browser-service/quality.yaml
      - name: Test dashboard controls and worker through a real browser
        run: uv run --locked katydid run tests/browser/quality.yaml
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence-${{ matrix.os }}
          path: |
            examples/browser-service/.katydid/runs/
            examples/browser-service/test-results/
            tests/browser/.katydid/runs/
            tests/browser/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
