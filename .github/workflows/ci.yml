name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked
      - name: Verify toolchain
        run: uv run --locked python -c "import platform; assert platform.python_version() == '3.12.13'; print(platform.python_version())"
      - name: Run Katydid against its own profile
        run: uv run --locked katydid run katydid.yaml
      - name: Run example repository
        run: uv run --locked katydid run examples/python-service/quality.yaml
      - name: Build package
        run: uv build --no-sources
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ matrix.os }}
          path: |
            .katydid/runs/
            examples/python-service/.katydid/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
